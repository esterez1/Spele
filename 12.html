<!DOCTYPE html>

<head>

<title>Dabbin</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }

</style>

<body>
<header>
  <h1>Dabbin</h1>
</header>
<main>
  <p>Savāc.</p>
  <ul>
    <li>Savāc draugus un kārtis.</li>
    <li>Sajauc kārtis un izdala katram spēlētājam 7. </li>
    <li>Atliec vienu kārti galda vidū. </li>
  </ul>
</main>
<footer>
  <p>Spēle.</p>
  <li>Liec kārti pēc krāsas, skaitļa vai simbola.</li>
  <li>Izmanto īpašās kārtis, lai pārsteigtu pretiniekus.</li>
  <li>Kad paliek viena kārts, neaizmirsti pateikt "Dab!"</li>
</footer>
</body>
